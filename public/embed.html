<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Feed Embed Widget</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #121827;
      --bg-card: #121827;
      --bg-input: #1a2338;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-subtle: rgba(255, 255, 255, 0.12);
      --accent-color: #6366f1;
      --accent-red: #ff0000;
    }

    [data-theme='light'] {
      --bg-main: #ffffff;
      --bg-card: #ffffff;
      --bg-input: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border-subtle: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg-card);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.18);
      border-radius: 4px;
    }
    [data-theme='dark'] ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Seamless Container Frame */
    .widget-container {
      background: var(--bg-card);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      height: 100%;
      width: 100%;
      overflow-y: auto;
      box-sizing: border-box;
    }

    /* Search & Filter Header */
    .search-wrapper {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 0.65rem 1rem;
      transition: border-color 0.2s ease;
    }

    .search-wrapper:focus-within {
      border-color: var(--accent-color);
    }

    .search-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex: 1;
    }

    .search-icon {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.9rem;
      width: 100%;
    }

    .sort-select {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      gap: 1.25rem;
    }
    .cols-2 { grid-template-columns: repeat(2, 1fr); }
    .cols-3 { grid-template-columns: repeat(3, 1fr); }
    .cols-4 { grid-template-columns: repeat(4, 1fr); }

    @media (max-width: 768px) {
      .cols-3, .cols-4 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .cols-2, .cols-3, .cols-4 { grid-template-columns: 1fr; }
    }

    /* Video Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-color);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
    }

    .title {
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* Modal Player */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal.active { display: flex; }
    .modal-inner {
      background: var(--bg-card);
      border-radius: 16px;
      width: 100%;
      max-width: 800px;
      overflow: hidden;
    }
    .modal-player {
      width: 100%;
      aspect-ratio: 16 / 9;
    }
    .modal-player iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .modal-close {
      padding: 0.5rem 1rem;
      background: var(--bg-input);
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      font-weight: bold;
      float: right;
      margin: 0.5rem;
      border-radius: 6px;
    }

    .error-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
      padding: 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div id="search-box" class="search-wrapper">
      <div class="search-left">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search videos in channel feed...">
      </div>

      <select id="sort-select" class="sort-select">
        <option value="newest">Newest First</option>
        <option value="popular">Most Popular</option>
        <option value="oldest">Oldest First</option>
      </select>
    </div>

    <div id="video-grid" class="grid cols-3"></div>
  </div>

  <div id="player-modal" class="modal">
    <div class="modal-inner">
      <button class="modal-close" onclick="closeModal()">Close ✕</button>
      <div class="modal-player" id="modal-player-box"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const apiKey = params.get('key');
    const channelId = params.get('channel');
    const cols = params.get('cols') || '3';
    const maxResults = params.get('max') || '50';
    const theme = params.get('theme') || 'light';
    const color = params.get('color') ? decodeURIComponent(params.get('color')) : '#6366f1';
    const showSearch = params.get('search') !== '0';
    const showViews = params.get('views') !== '0';
    const showDuration = params.get('duration') !== '0';

    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.setProperty('--accent-color', color);

    if (!showSearch) {
      document.getElementById('search-box').style.display = 'none';
    }

    const grid = document.getElementById('video-grid');
    grid.className = `grid cols-${cols}`;

    const MOCK_VIDEOS = [
      { id: "bMknfKXIFA8", title: "React Course 2026 - Beginner to Pro Project Walkthrough", thumbnail: "https://images.unsplash.com/photo-1633356122544-f134324a6cee?q=80&w=800&auto=format&fit=crop", views: "142.5K views", duration: "18:42" },
      { id: "Ke90Tje7VS0", title: "Building Modern Web Apps with Vite, React & Tailwind CSS", thumbnail: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?q=80&w=800&auto=format&fit=crop", views: "89.2K views", duration: "24:15" },
      { id: "rfscVS0vtbw", title: "10 JavaScript Tips Every Developer Must Know in 2026", thumbnail: "https://images.unsplash.com/photo-1579468118864-1b9ea3c0db4a?q=80&w=800&auto=format&fit=crop", views: "215K views", duration: "12:08" },
      { id: "SqcY0GlETPk", title: "CSS Grid vs Flexbox - Complete Visual Guide", thumbnail: "https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?q=80&w=800&auto=format&fit=crop", views: "64.8K views", duration: "15:30" },
      { id: "dQw4w9WgXcQ", title: "Fullstack Web Development Roadmap & Tech Stack 2026", thumbnail: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?q=80&w=800&auto=format&fit=crop", views: "340.1K views", duration: "32:50" },
      { id: "LDB4uaJ87e0", title: "Mastering REST APIs & Fetch / Axios in JavaScript", thumbnail: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=800&auto=format&fit=crop", views: "98.4K views", duration: "21:10" }
    ];

    let loadedVideos = [];

    function parseDuration(durationStr) {
      if (!durationStr) return "";
      const match = durationStr.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
      if (!match) return "";
      const hours = parseInt(match[1] || 0, 10);
      const minutes = parseInt(match[2] || 0, 10);
      const seconds = parseInt(match[3] || 0, 10);
      const secFormatted = seconds < 10 ? `0${seconds}` : `${seconds}`;
      if (hours > 0) {
        const minFormatted = minutes < 10 ? `0${minutes}` : `${minutes}`;
        return `${hours}:${minFormatted}:${secFormatted}`;
      }
      return `${minutes}:${secFormatted}`;
    }

    function formatViews(viewsStr) {
      if (!viewsStr) return "";
      const num = parseInt(viewsStr, 10);
      if (num >= 1000000) return (num / 1000000).toFixed(1) + "M views";
      if (num >= 1000) return (num / 1000).toFixed(1) + "K views";
      return num + " views";
    }

    function render(videos, errorMsg) {
      if (errorMsg) {
        grid.innerHTML = `<div class="error-banner">⚠️ YouTube API Error: ${errorMsg}</div>`;
        return;
      }

      if (!videos || videos.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 2rem; color: var(--text-muted);">No videos found.</div>`;
        return;
      }

      grid.innerHTML = videos.map(v => `
        <div class="card" onclick="openModal('${v.id}')">
          <div class="thumb">
            <img src="${v.thumbnail}" alt="${v.title}">
            ${showDuration && v.duration ? `<span class="badge">${v.duration}</span>` : ''}
          </div>
          <div class="info">
            <h4 class="title">${v.title}</h4>
            <div class="meta">
              ${showViews && v.views ? `<span>👁 ${v.views}</span>` : ''}
              ${v.dateStr ? `<span>📅 ${v.dateStr}</span>` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function applyFilterAndSort() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const sortVal = document.getElementById('sort-select').value;

      let list = loadedVideos.filter(v => v.title.toLowerCase().includes(q));

      if (sortVal === 'newest') {
        list.sort((a, b) => new Date(b.publishedAt || 0) - new Date(a.publishedAt || 0));
      } else if (sortVal === 'oldest') {
        list.sort((a, b) => new Date(a.publishedAt || 0) - new Date(b.publishedAt || 0));
      } else if (sortVal === 'popular') {
        list.sort((a, b) => {
          const vA = parseInt((a.views || '').replace(/[^0-9]/g, '') || '0', 10);
          const vB = parseInt((b.views || '').replace(/[^0-9]/g, '') || '0', 10);
          return vB - vA;
        });
      }

      render(list);
    }

    async function loadData() {
      if (apiKey && apiKey.trim() !== '' && channelId && channelId.trim() !== '' && channelId !== 'DEMO') {
        try {
          // 1. Fetch channel videos via YouTube search endpoint (up to 50 max results)
          const searchUrl = `https://www.googleapis.com/youtube/v3/search?key=${encodeURIComponent(apiKey.trim())}&channelId=${encodeURIComponent(channelId.trim())}&part=snippet,id&order=date&maxResults=${maxResults}&type=video`;
          const res = await fetch(searchUrl);
          const searchData = await res.json();

          if (searchData.error) {
            render(null, searchData.error.message || "Failed to fetch from YouTube API.");
            return;
          }

          if (searchData.items && searchData.items.length > 0) {
            // Render channel videos IMMEDIATELY from search results
            loadedVideos = searchData.items.map(item => ({
              id: item.id?.videoId || item.id,
              title: item.snippet?.title || "YouTube Video",
              thumbnail: item.snippet?.thumbnails?.high?.url || item.snippet?.thumbnails?.medium?.url || item.snippet?.thumbnails?.default?.url,
              publishedAt: item.snippet?.publishedAt,
              dateStr: new Date(item.snippet?.publishedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }),
              views: "",
              duration: ""
            })).filter(v => Boolean(v.id));

            applyFilterAndSort();

            // 2. Asynchronously fetch duration & statistics to enrich video cards
            try {
              const videoIds = loadedVideos.map(v => v.id).join(",");
              if (videoIds) {
                const statsUrl = `https://www.googleapis.com/youtube/v3/videos?key=${encodeURIComponent(apiKey.trim())}&id=${videoIds}&part=snippet,statistics,contentDetails`;
                const statsRes = await fetch(statsUrl);
                const statsData = await statsRes.json();

                if (statsData.items && statsData.items.length > 0) {
                  const statsMap = {};
                  statsData.items.forEach(i => { statsMap[i.id] = i; });

                  loadedVideos = loadedVideos.map(v => {
                    const detail = statsMap[v.id];
                    if (!detail) return v;
                    return {
                      ...v,
                      thumbnail: detail.snippet?.thumbnails?.maxres?.url || detail.snippet?.thumbnails?.high?.url || v.thumbnail,
                      views: formatViews(detail.statistics?.viewCount),
                      duration: parseDuration(detail.contentDetails?.duration)
                    };
                  });
                  applyFilterAndSort();
                }
              }
            } catch (statsErr) {
              console.warn("Could not enrich stats, keeping base videos:", statsErr);
            }
            return;
          } else {
            render([]);
            return;
          }
        } catch (e) {
          console.error("YouTube API Fetch Error:", e);
          render(null, e.message);
          return;
        }
      }

      // Fallback to Demo Mode Mock Data ONLY if key/channel missing
      loadedVideos = MOCK_VIDEOS.slice(0, parseInt(maxResults, 10)).map(v => ({
        ...v,
        publishedAt: new Date().toISOString(),
        dateStr: "Sep 1, 2026"
      }));
      applyFilterAndSort();
    }

    loadData();

    document.getElementById('search-input').addEventListener('input', applyFilterAndSort);
    document.getElementById('sort-select').addEventListener('change', applyFilterAndSort);

    function openModal(id) {
      const modal = document.getElementById('player-modal');
      const box = document.getElementById('modal-player-box');
      box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      modal.classList.add('active');
    }

    function closeModal() {
      const modal = document.getElementById('player-modal');
      document.getElementById('modal-player-box').innerHTML = '';
      modal.classList.remove('active');
    }
  </script>
</body>
</html>
